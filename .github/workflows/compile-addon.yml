name: Compile Addon

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    paths-ignore:
      - "**.mcaddon"
      - "docs/index.html"
      - "README.md"
      - ".github/**"
      - ".agent/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compile-addon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate manifests
        run: npm run validate

      - name: Type-check TypeScript
        run: npm run typecheck

      - name: Build production scripts
        run: |
          npm run build
          node obfuscate_release.js

      - name: Create .mcaddon files
        run: |
          VERSION=$(node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync("LeefySpawners BEH/manifest.json","utf8")); process.stdout.write(m.header.version.join("."));')
          echo "ADDON_VERSION=$VERSION" >> "$GITHUB_ENV"

          rm -f LeefySpawnersBEH_*.mcpack LeefySpawnersRES_*.mcpack
          (
            cd "LeefySpawners BEH"
            zip -q -r "../LeefySpawnersBEH_$VERSION.mcpack" .
          )
          (
            cd "LeefySpawners RES"
            zip -q -r "../LeefySpawnersRES_$VERSION.mcpack" .
          )
          zip -q -j "LeefySpawners_$VERSION.mcaddon" \
            "LeefySpawnersBEH_$VERSION.mcpack" \
            "LeefySpawnersRES_$VERSION.mcpack"
          cp "LeefySpawners_$VERSION.mcaddon" LeefySpawners.mcaddon
          rm -f "LeefySpawnersBEH_$VERSION.mcpack" "LeefySpawnersRES_$VERSION.mcpack"

          node sync-readme.mjs

          mkdir -p docs
          cat > docs/index.html <<EOF
          <!DOCTYPE html>
          <html>
          <head>
            <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
            <meta http-equiv="Pragma" content="no-cache">
            <meta http-equiv="Expires" content="0">
            <title>LeefySpawners Download</title>
          </head>
          <body>
            <script>
              window.location.replace("https://github.com/${{ github.repository }}/raw/master/LeefySpawners.mcaddon?t=" + Date.now());
            </script>
            Redirecting to the latest LeefySpawners release...
          </body>
          </html>
          EOF

      - name: Upload compiled addon
        uses: actions/upload-artifact@v4
        with:
          name: LeefySpawners-${{ env.ADDON_VERSION }}
          path: |
            LeefySpawners_${{ env.ADDON_VERSION }}.mcaddon
            LeefySpawners.mcaddon
          if-no-files-found: error

      - name: Commit production build
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package-lock.json
          git add "LeefySpawners BEH/scripts/module"
          git add README.md docs/index.html
          git add -f "LeefySpawners_${ADDON_VERSION}.mcaddon" LeefySpawners.mcaddon

          if ! git diff --cached --quiet; then
            git commit -m "build: publish LeefySpawners v${ADDON_VERSION} [skip ci]"
            git push origin HEAD:master
          else
            echo "Production build is already current."
          fi
