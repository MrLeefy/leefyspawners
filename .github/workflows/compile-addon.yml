name: Compile Addon

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.mcaddon'
      - 'README.md'
      - '.github/**'
      - '.agent/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: |
          npm run build
          node obfuscate_release.js

      - name: Create .mcaddon File
        run: |
          node bump-manifests.js
          VERSION=$(jq -r '.header.version | join(".")' "JUN06LeefySpawners BEH/manifest.json")
          cd "JUN06LeefySpawners BEH" && zip -r ../LeefySpawnersBEH_$VERSION.mcpack * && cd ..
          cd "JUN06LeefySpawners RES" && zip -r ../LeefySpawnersRES_$VERSION.mcpack * && cd ..
          zip -j LeefySpawners_$VERSION.mcaddon LeefySpawnersBEH_$VERSION.mcpack LeefySpawnersRES_$VERSION.mcpack
          cp LeefySpawners_$VERSION.mcaddon LeefySpawners.mcaddon
          rm LeefySpawnersBEH_$VERSION.mcpack LeefySpawnersRES_$VERSION.mcpack
          
          mkdir -p docs
          cat << EOF > docs/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
            <meta http-equiv="Pragma" content="no-cache">
            <meta http-equiv="Expires" content="0">
            <title>Redirecting...</title>
          </head>
          <body>
            <script>
              window.location.replace("https://github.com/${{ github.repository }}/raw/master/LeefySpawners.mcaddon?t=" + Date.now());
            </script>
            Redirecting to latest release...
          </body>
          </html>
          EOF

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Clean up older mcaddon files from Git tracking
          git rm --cached "LeefySpawners_*.mcaddon" || true
          git rm --cached "LeefySpawners.mcaddon" || true
          git add -f LeefySpawners_*.mcaddon
          git add -f LeefySpawners.mcaddon
          git add -f docs/index.html
          git add "JUN06LeefySpawners BEH/manifest.json" "JUN06LeefySpawners RES/manifest.json" package.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-bump version and generate new UUIDs [skip ci]"
            git push origin master
          else
            echo "No changes to the compiled addon."
          fi
